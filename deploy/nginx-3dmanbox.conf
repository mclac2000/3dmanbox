# /etc/nginx/sites-available/3dmanbox
# Bedient sowohl 3dmanbox.com als auch 3dman.club — Next.js routet anhand des Host-Headers via proxy.ts.

upstream 3dmanbox_upstream {
    server 127.0.0.1:3030;
    keepalive 32;
}

# ---------- 3dmanbox.com (HTTP → HTTPS redirect) ----------
server {
    listen 80;
    listen [::]:80;
    server_name 3dmanbox.com www.3dmanbox.com 3dman.club www.3dman.club;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- 3dmanbox.com (HTTPS) ----------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name 3dmanbox.com www.3dmanbox.com;

    ssl_certificate /etc/letsencrypt/live/3dmanbox.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/3dmanbox.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    client_max_body_size 10m;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml+rss image/svg+xml;
    gzip_min_length 1024;

    # Stripe webhook — raw body, never cache
    location = /api/stripe/webhook {
        proxy_pass http://3dmanbox_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
    }

    location / {
        proxy_pass http://3dmanbox_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 90s;
    }
}

